name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check specs
        run: |
          python build_schema.py --check
          python build_app.py --check
          python build_app.py --check --app core
          python build_app.py --check --app intake
          python build_flows.py --check
      - name: Offline tests (fake Dataverse)
        run: |
          python tests/test_offline.py
          python tests/test_app_offline.py
          python tests/test_counties.py
          python tests/test_branding.py
          python tests/test_flows.py
          python tests/test_ami.py
          python tests/test_import.py
          python tests/test_prescreen.py
          python tests/test_regular.py
          python tests/test_resale.py
          python tests/test_verify.py
          python tests/test_insurance.py
          python tests/test_newproject.py
          python tests/test_selection.py
          python tests/test_invite.py
          python tests/test_certify.py
